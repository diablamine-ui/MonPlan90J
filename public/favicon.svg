<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fond noir avec coins arrondis -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1508;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A0A0A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8C97A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C9A84C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B6914;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fond arrondi -->
  <rect width="512" height="512" rx="100" ry="100" fill="url(#bgGrad)"/>
  
  <!-- Bordure or subtile -->
  <rect width="512" height="512" rx="100" ry="100" fill="none" stroke="#C9A84C" stroke-width="6" opacity="0.4"/>
  
  <!-- Bordure intérieure fine -->
  <rect x="20" y="20" width="472" height="472" rx="82" ry="82" fill="none" stroke="#C9A84C" stroke-width="1.5" opacity="0.25"/>

  <!-- Ornements coins -->
  <text x="256" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#C9A84C" opacity="0.6" letter-spacing="12">✦ ✦ ✦</text>
  
  <!-- Chiffre 90 -->
  <text x="256" y="310" text-anchor="middle" 
    font-family="Georgia, 'Times New Roman', serif" 
    font-size="220" 
    font-weight="bold"
    fill="url(#goldGrad)"
    filter="url(#glow)"
    letter-spacing="-8">90</text>
  
  <!-- Ligne séparatrice -->
  <line x1="156" y1="335" x2="356" y2="335" stroke="#C9A84C" stroke-width="1" opacity="0.5"/>
  
  <!-- JOURS -->
  <text x="256" y="375" text-anchor="middle" 
    font-family="Georgia, serif" 
    font-size="42" 
    fill="#C9A84C"
    letter-spacing="14"
    opacity="0.9">JOURS</text>
  
  <!-- Sous-titre -->
  <text x="256" y="418" text-anchor="middle" 
    font-family="Georgia, serif" 
    font-size="22" 
    fill="#8B6914"
    letter-spacing="4"
    font-style="italic">Mon Plan de Vie</text>

  <!-- Ornement bas -->
  <text x="256" y="462" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#C9A84C" opacity="0.4" letter-spacing="8">◈</text>
</svg>
